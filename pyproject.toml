[project]
name = "momo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "albumentations>=2.0.8",
    "click>=8.5.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "split-folders>=0.6.1",
    "torch>=2.5.0,<3",
    "torchvision>=0.20.0,<1",
